<style>
/* ---- admin 전용 ---- */
.adm-draft{margin:0 16px 10px;background:#FFF4E5;border:1.5px solid #F0B46A;border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.5;color:#3a2a14}
#adm .adm-draft{margin:0 0 10px}
.adm-draft b{display:block;font-size:14.5px;margin-bottom:2px}
.adm-draft-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.adm-draft[hidden]{display:none}
.rv{margin-top:8px}
.rv summary{cursor:pointer;font-weight:700;color:#8a4b12;padding:4px 0}
.rv summary em{font-style:normal;font-weight:600;color:#a0703a;margin-left:4px}
.rv-help{margin:4px 0 8px;font-size:12px;color:#6b5434}
.rv-sec{background:#fff;border-radius:12px;padding:8px 10px;margin-bottom:6px}
.rv-all{display:flex;align-items:center;gap:6px;font-size:13.5px}
.rv-all small{color:#9a8a76;font-weight:500}
.rv-items{margin:6px 0 2px 4px;display:flex;flex-direction:column;gap:4px}
.adm-review{flex:0 1 auto;min-height:0;max-height:62%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.rv-it{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:#3a2a14}
.rv-it input,.rv-all input{width:17px;height:17px;flex:none;margin-top:1px;accent-color:var(--accent)}
.rv-same{color:#9a8a76;font-size:11px}
.rv-off{color:#b0603a;font-size:11px;font-weight:500}
.rv-go{display:block;width:100%;margin-top:10px;padding:12px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px}
.rv-saved{color:#2f7d4a;font-weight:600;margin-left:2px}
.rv-30{margin:6px 0 2px;padding:5px 10px;border-radius:999px;border:1.5px solid var(--accent);color:var(--accent);background:#fff;font-size:12.5px;font-weight:700}
.sync-now{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.sync-now button{border:1.5px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:999px;padding:7px 14px;font:inherit;font-size:13.5px;font-weight:700}
.sync-now button:disabled{opacity:.5}
.sync-now small{color:var(--muted);font-size:12px}
.sync-one{padding:8px 12px 0;margin:0}
.rv-status{margin:6px 0 0;font-size:12.5px;color:#6b5434;min-height:16px}
#sellerUI{height:100%}
.adm-bar{flex:none;display:flex;align-items:center;gap:8px;padding:calc(7px + env(safe-area-inset-top,0px)) 10px 7px 12px;background:#2B2F3A;color:#fff;font-size:12.5px;line-height:1.3;position:relative;z-index:5}
.adm-bar a{color:#fff;font-weight:700;text-decoration:none;white-space:nowrap;opacity:.9}
.adm-bar .adm-tag{flex:none;background:#F2B544;color:#2B2F3A;font-weight:800;font-size:11px;letter-spacing:.04em;border-radius:6px;padding:2px 6px}
.adm-bar .adm-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
.adm-bar select{flex:none;border:0;background:rgba(255,255,255,.14);border-radius:999px;padding:4px 8px;font:inherit;font-size:12.5px;color:#fff;max-width:128px}
.adm-bar select option{color:#222}
.who[hidden],.app[hidden],#sellerUI[hidden]{display:none!important}
.filters{display:flex;gap:6px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
.chip.team{background:var(--surface-2)}
.chip.team[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.day .marks{flex-wrap:wrap;justify-content:center;height:auto;max-width:34px;row-gap:2px}
.day{height:auto;min-height:60px;padding-bottom:6px}
.day .cnt{font-size:9px;color:var(--muted);line-height:1}
.sel-group{margin-top:14px}
.sel-head{display:flex;align-items:center;gap:8px;margin:0 2px 8px}
.sel-head b{font-size:16px}
.sel-head .team-badge{font-size:11px;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:1px 8px}
.sel-head a{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none}
.sel-head .sw{width:10px;height:10px;border-radius:50%;background:var(--c)}
.mini{display:flex;flex-direction:column;gap:6px}
.mini .entry{grid-template-columns:auto 1fr;padding:11px 13px}
.mini .fmt{width:40px;height:40px;font-size:10.5px}
.e-prod{display:inline-flex;align-items:center;gap:5px}
.load-note{margin:10px 2px;font-size:12px;color:var(--muted)}
.sale-row .sname{font-size:11px;font-weight:700;color:var(--muted);margin-right:4px}
.sales-wrap{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.sales-wrap h4{margin:6px 2px 0;font-size:12.5px;color:var(--muted)}
.empty-day{padding:18px;text-align:center;color:var(--muted);background:var(--surface);border-radius:16px;font-size:14px}
</style>

<script>
(function () {   // admin 화면 코드는 따로 감싸서, 같은 페이지에 그리는 셀러 화면 코드와 이름이 겹치지 않게
const SELLERS = [
  {team:"A팀", name:"방효선", repo:"imxux9", sheet:"1MTLBlWcl9DvJGwltiB1Ks1ugitJz8p6d7OcDlZ416WA",       c:"#E07A5F"},
  {team:"A팀", name:"초아",   repo:"minjinchoa", sheet:"1pkUC-malhHyzcAuwONl7qSuz1MBHw1KbmEwUiw5Om6E",   c:"#F2B134"},
  {team:"A팀", name:"미자",   repo:"mija_uni", sheet:"1ZV4B-kq0rGuX7CV_fc9FEBmkm68Zrg9e45VrQAkokqE",     c:"#81B29A"},
  {team:"B팀", name:"베르베르", repo:"berberlog", sheet:"1OH20HJmS2L-s7qBhRH3VQcdOyyPchFYUDxum-N-h7AI",  c:"#5B8DEF"},
  {team:"B팀", name:"덕덕",   repo:"duckduck0613", sheet:"1qb1TsBgDTvlX0qAFSXQfKi1uk1FTyyINzj1Tw2qriys", c:"#9B6FD3"},
  {team:"B팀", name:"한기솔", repo:"___solvely___", sheet:"1cbP2TpBab5Bbr2QZxEl1foFFSbdeCXX4nmXkLOrLUMc",c:"#E86A9E"},
  {team:"C팀", name:"뽕커벨", repo:"paorang73", sheet:"1H8IVRWx9Hy0cftcUSsxsTxV2YhhhJuCC_wipfe1Xl50",    c:"#C0392B"},
  {team:"C팀", name:"스미홈트", repo:"smitruti1010", sheet:"1ooVGVTIk8s3XOWKbto-AyByLryrcpVpRhhXeRNgDOYs",c:"#2A9D8F"},
  {team:"C팀", name:"에나스쿨", repo:"shinyoung_h", sheet:"16IOaMz2BN3FVEmW6yxOF4-9bvQQ8u5G7awETjp9W64k", c:"#8D6E63"},
  {team:"신규", name:"해서영", repo:"hae.seoyoung", sheet:"1qiX7x_f0iak5HMoPyU8ZXZhMi9d1zMoKBx3zeds1zQM", c:"#D4A373"},
];
const TEAMS = ["전체", "A팀", "B팀", "C팀", "신규"];
const DOW = ["일","월","화","수","목","금","토"];
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const md = s => { const d = parse(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plain = s => String(s ?? "").replace(/⟪[^⟫]*⟫/g, "").replace(/⟦([^|⟧]*)\|[^⟧]*⟧/g, "$1").replace(/\s+/g, " ").trim();
const FMT = f => /릴스|reel/i.test(f) ? ["릴스","reel"] : /스토리|story/i.test(f) ? ["스토리","story"] : /캐러셀|carousel/i.test(f) ? ["캐러셀",""] : /피드|게시물|post/i.test(f) ? ["피드","post"] : [f ? String(f).slice(0,3) : "일정", ""];

function load(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

let team = load("adm.team", "전체");
let off = new Set(load("adm.off", []));          // 끈 셀러
const today = key(new Date());
let sel = today;
let cur = new Date(); cur.setDate(1);
const ALL = {};                                     // repo -> {uploads, events, sales}

function shown() { return SELLERS.filter(s => (team === "전체" || s.team === team) && !off.has(s.repo) && ALL[s.repo]); }

function firstText(slot) {
  if (slot.title) return plain(slot.title);
  for (const it of slot.items || []) for (const [k, v] of Object.entries(it)) if (!k.startsWith("__") && typeof v === "string" && plain(v)) return plain(v).slice(0, 60);
  return "";
}

function digest(s, D) {
  const uploads = [], events = [], sales = [];
  for (const p of D.products || []) {
    const pname = p.name + (p.round ? " " + p.round : "");
    if (p.period && p.period[0]) sales.push({s: p.period[0], e: p.period[1] || p.period[0], name: pname, color: p.color});
    for (const sl of p.slots || []) if (sl.date) uploads.push({date: sl.date, prod: pname, pc: p.color, format: sl.format, label: sl.label, text: firstText(sl)});
  }
  for (const e of D.events || []) events.push({date: e.date, end: e.end || e.date, text: plain(e.text), kind: e.kind, prod: e.product});
  return {uploads, events, sales, updated: D.updated};
}

function renderFilters() {
  $("#teams").innerHTML = TEAMS.map(t => `<button class="chip team" type="button" data-t="${t}" aria-pressed="${t === team}">${t}</button>`).join("");
  const list = SELLERS.filter(s => team === "전체" || s.team === team);
  $("#sellers").innerHTML = list.map(s => `<button class="chip" type="button" data-s="${s.repo}" aria-pressed="${!off.has(s.repo)}" style="--c:${s.c}"><i></i>${esc(s.name)}${ALL[s.repo] ? "" : " …"}</button>`).join("");
  $("#opens").innerHTML = `<span style="flex:none;font-size:12px;color:var(--muted);align-self:center">셀러 화면 열기</span>` + list.map(s => `<a class="chip" href="?s=${s.repo}" style="--c:${s.c};text-decoration:none;color:inherit"><i></i>${esc(s.name)} →</a>`).join("");
  $("#teams").onclick = ev => { const b = ev.target.closest("[data-t]"); if (!b) return; team = b.dataset.t; save("adm.team", team); renderAll(); };
  $("#sellers").onclick = ev => { const b = ev.target.closest("[data-s]"); if (!b) return; const r = b.dataset.s; off.has(r) ? off.delete(r) : off.add(r); save("adm.off", [...off]); renderAll(); };
}

function renderSales() {
  const live = [], soon = [];
  const in14 = key(new Date(Date.now() + 14 * 864e5));
  for (const s of shown()) for (const r of ALL[s.repo].sales) {
    if (r.s <= today && today <= r.e) live.push({s, r});
    else if (r.s > today && r.s <= in14) soon.push({s, r});
  }
  soon.sort((a, b) => a.r.s.localeCompare(b.r.s));
  const row = ({s, r}, isLive) => {
    const dd = Math.round((parse(r.s) - parse(today)) / 864e5);
    return `<a class="sale-row${isLive ? " live" : ""}" href="?s=${s.repo}" style="--c:${s.c};text-decoration:none;color:inherit"><div class="t"><div class="k"><span class="sname">${esc(s.name)}</span>${isLive ? "진행 중 공구" : "다음 공구"}</div><div class="nm">${esc(r.name)}</div></div><div class="v"><b>${isLive ? "~" + md(r.e) : "D-" + dd}</b><small>${md(r.s)}–${md(r.e)}</small></div></a>`;
  };
  $("#sales").innerHTML = (live.length ? `<h4>진행 중 공구 ${live.length}</h4>` + live.map(x => row(x, true)).join("") : "")
    + (soon.length ? `<h4>2주 안에 열리는 공구 ${soon.length}</h4>` + soon.map(x => row(x, false)).join("") : "");
}

function dayItems(k) {
  const out = [];
  for (const s of shown()) {
    const A = ALL[s.repo];
    const ups = A.uploads.filter(u => u.date === k);
    const evs = A.events.filter(e => e.date <= k && k <= e.end && e.kind !== "holiday" && !(e.kind === "content" && ups.length));
    const opens = A.sales.filter(r => r.s === k);
    if (ups.length || evs.length || opens.length) out.push({s, ups, evs, opens});
  }
  return out;
}

function renderGrid() {
  const y = cur.getFullYear(), m = cur.getMonth();
  $("#mtitle").textContent = `${m + 1}월`;
  $("#eyebrow").textContent = `${y}년 · admin 전체 셀러`;
  const first = new Date(y, m, 1), start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = key(d), items = dayItems(k);
    const cls = ["day"]; if (d.getMonth() !== m) cls.push("out"); if (k === today) cls.push("today"); if (k === sel) cls.push("sel");
    if (d.getDay() === 6) cls.push("sat"); if (d.getDay() === 0) cls.push("sun");
    const dots = items.slice(0, 6).map(x => `<i class="sdot" style="--c:${x.s.c}"></i>`).join("") + (items.length > 6 ? `<span class="cnt">+${items.length - 6}</span>` : "");
    const open = items.some(x => x.opens.length) ? `<span class="open-tag">OPEN</span>` : "";
    cells.push(`<button type="button" class="${cls.join(" ")}" data-k="${k}"><span class="n">${d.getDate()}</span><span class="marks">${dots}</span>${open}</button>`);
  }
  $("#grid").innerHTML = cells.join("");
  $("#grid").onclick = ev => { const b = ev.target.closest("[data-k]"); if (!b) return; sel = b.dataset.k; renderGrid(); renderAgenda(); };
  $("#legend").innerHTML = shown().map(s => `<span><i class="sdot" style="--c:${s.c}"></i>${esc(s.name)}</span>`).join("");
}

function renderAgenda() {
  const d = parse(sel);
  const groups = dayItems(sel);
  let h = `<div class="ag-date"><span class="big">${d.getMonth() + 1}월 ${d.getDate()}일</span><span class="dow">${DOW[d.getDay()]}요일${sel === today ? " · 오늘" : ""}</span></div>`;
  if (!groups.length) h += `<div class="empty-day">이날은 등록된 일정이 없어요.</div>`;
  for (const g of groups) {
    h += `<div class="sel-group"><div class="sel-head" style="--c:${g.s.c}"><span class="sw"></span><b>${esc(g.s.name)}</b><span class="team-badge">${g.s.team}</span><a href="?s=${g.s.repo}">전체 화면 보기 →</a></div><div class="mini">`;
    for (const r of g.opens) h += `<div class="entry"><div class="fmt" style="background:${r.color || "var(--accent-soft)"};color:#2E2520">OPEN</div><div class="e-body"><div class="e-title">${esc(r.name)} 공구 오픈</div><div class="e-meta">${md(r.s)}–${md(r.e)}</div></div></div>`;
    for (const u of g.ups) { const [f, fc] = FMT(u.format);
      h += `<div class="entry"><div class="fmt ${fc}">${esc(f)}</div><div class="e-body"><div class="e-title">${esc(u.text || u.prod + " " + (u.label || ""))}</div><div class="e-meta"><span class="e-prod"><i class="dotc" style="--c:${u.pc || g.s.c}"></i>${esc(u.prod)}</span>${u.label ? `<span>${esc(u.label)}</span>` : ""}</div></div></div>`; }
    for (const e of g.evs) h += `<div class="entry"><div class="fmt meeting">${e.kind === "meeting" ? "미팅" : "일정"}</div><div class="e-body"><div class="e-title">${esc(e.text)}</div>${e.end !== e.date ? `<div class="e-meta">${md(e.date)}–${md(e.end)}</div>` : ""}</div></div>`;
    h += `</div></div>`;
  }
  $("#agenda").innerHTML = h;
}

function renderAll() { renderFilters(); renderSales(); renderGrid(); renderAgenda(); }

$("#prev").onclick = () => { cur.setMonth(cur.getMonth() - 1); renderGrid(); };
$("#next").onclick = () => { cur.setMonth(cur.getMonth() + 1); renderGrid(); };
$("#today").onclick = () => { cur = new Date(); cur.setDate(1); sel = today; renderGrid(); renderAgenda(); };

// ---- 비밀번호 (해시로만 비교; 맞히면 이 기기에서는 다시 묻지 않음) ----
const PW_HASH = "f8b6fb1e306b161ae8d429b89379ccf06eecddf4fb13b7d0fe0dc50399a6e89e";
async function sha(s) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
function unlock() { $("#admgate").hidden = true; route(); }
// ---- 원본 시트 지금 연동하기: Apps Script 가 셀러 빌드를 바로 돌리고, 셀러 사이트의 업데이트 시각이 바뀌면 완료로 표시 ----
async function buildNow(list, st, btn) {
  const key = await syncKey(true); if (!key) return;
  if (!window.LOG_URL_ADM) { st.textContent = "연동 주소가 없어요."; return; }
  const updated = async s => { try { const r = await fetch(`/${s.repo}/data.json?t=${Date.now()}`, {cache: "no-store"}); return (await r.json()).updated || ""; } catch (e) { return ""; } };
  const before = {}; for (const s of list) before[s.repo] = await updated(s);

// 커머스 CS 불만(배송·품절·선착순·결제/접속 오류·마감 연장·환불/교환·재고·링크·가격) 항목은 셀러 캘린더에 기본으로 안 보냄

  /품절|재고/,
  /선착순[^.,!?]{0,15}(놓|실패|못|마감|아쉽|불만|끝)|놓쳤|놓침|마감 ?놓/,
  /(결제|접속|주문|구매|사이트|앱)[^.,!?]{0,8}(오류|에러|튕|실패|불가|안 ?돼|안 ?되|막혀|먹통|접속 ?안)|구매 ?불가/,

  /(가격|할인)[^.,!?]{0,12}(불만|비싸|속상|차이|아쉽)|너무 비싸|비싸요|비싸서|비싸다는|더 할인돼|가격 ?불만/,
  // 상업화 피로: 점점 상업적으로 가서 아쉽다, 팔이피플이 다 됐다 등 (2026-11-16 재열님)
  /상업적|장사꾼|장사만|팔이피플[이가]? ?다 ?(됐|되었|돼)|광고만|광고가? 너무 많|공구만 (하|올|해)|사먹으라고만|사라고만|홍보만|방향이 달라|예전 같지 않|예전이 그립|돈독|팔기만/
];
const CS_SKIP = new Set(["posts", "mood"]);   // 게시물 요약·댓글 분위기 비율은 여러 이야기가 섞여 있어 자동으로 빼지 않음

  const txt = typeof it === "string" ? it : [it.t, it.k, it.d, it.r, it.ex, it.q].filter(Boolean).join(" ");

async function reviewPanel(s, draft, live) {

    warns: "⚠️ 주의 신호", loves: "❤️ 팔로워가 좋아하는 점", asks: "❓ 자주 묻는 질문", wants: "🙋 팔로워 요청", kinds: "📊 콘텐츠 유형별 반응",
    who: "👥 어떤 팔로워인가요", ideas: "💡 일상 콘텐츠 힌트", posts: "🗂 게시물별 댓글 요약"};

  if (IQd && IQd.mood && IQd.counted) add("mood", GL.mood, {k: "iq:mood", lbl: `분위기 비율을 전체 댓글로 계산 — 팔로워 댓글 ${IQd.counted.toLocaleString()}개 기준${IQd.entries ? ` (이벤트 응모 ${IQd.entries.toLocaleString()}개 따로)` : ""}`});
  Object.entries(draft).forEach(([sec, v]) => {

    else if (sec === "changes" && v) {

      (v.deeper || []).forEach((x, i) => add(sec, GL.changes, {k: `changes:deeper:${i}`, sec, it: x, lbl: `심화 · ${x.t || ""} — ${x.d || ""}`}));
    } else if (sec === "iq" && v) {
      if (v.replies) { const r = v.replies; add("iq-reply", GL["iq-reply"], {k: "iq:replies", lbl: `셀러 답글 ${r.seller}개 · 답글 받은 팔로워 ${pc(r.got, r.users)}% · 같은 문구 답글 ${pc(r.template, r.seller)}%`}); }
      const Q = v.questions || {};
      if (Q.total != null) add("iq-q", GL["iq-q"], {k: "iq:questions", lbl: `안내 문장 — 팔로워 질문 ${Q.total}개 중 ${Q.unanswered}개(${pc(Q.unanswered, Q.total)}%)에 답글이 달리지 않았어요`});

      const bi = s => { const k = String(s || "").replace(/[^가-힣a-zA-Z0-9]/g, ""), b = new Set(); for (let i = 0; i < k.length - 1; i++) b.add(k.slice(i, i + 2)); return b; };

  const groups = [...ORDER.filter(g => G[g]), ...Object.keys(G).filter(g => !ORDER.includes(g))].map(g => G[g]);
  const liveAt = live && live.at ? `${live.at} 정리본` : "아직 없음";
  const box = document.createElement("div"); box.className = "adm-draft adm-review";
  box.innerHTML = `<b>검토 대기 중인 새 댓글 여론이에요</b>
    <span>${esc(draft.from || "")}~${esc(draft.to || "")} · ${esc(draft.at || "")} 정리. 아래 화면은 새 내용 전체예요. 셀러 캘린더에는 아직 적용되지 않았어요 (지금 셀러 화면: ${esc(liveAt)}).</span>
    <details class="rv"><summary>셀러 캘린더에 보낼 항목 고르기 <em id="rv-count"></em></summary>
      <p class="rv-help">체크한 항목만 셀러 캘린더에 들어가요. 체크를 다 뺀 항목·묶음은 셀러 화면에서 빠져요. 처음에는 <b>주의 신호</b> 항목 전체, <b>30일 지난 게시물 요약</b>, 그리고 <b>커머스 CS 불만</b>(배송 지연·파손, 품절, 선착순 놓침, 결제·접속 오류, 마감 연장 요청, 환불·교환, 재고, 링크 문의, 가격 불만, '점점 상업적으로 변해 아쉽다' 같은 상업화 불만 등)으로 보이는 항목은 체크가 빠진 채로 열려요. 필요하면 다시 체크해 주세요. 체크는 바로 저장돼서 다른 기기에서 열어도 똑같이 보이고, 저장된 체크가 있으면 그대로 불러와요. <small class="rv-saved" id="rv-saved"></small></p>
      ${groups.map(gr => gr.bundle
        ? `<div class="rv-sec"><label class="rv-all"><input type="checkbox" data-k="${gr.bundle}" checked> <b>${esc(gr.label)}</b> <small>묶음 1개</small></label></div>`
        : `<div class="rv-sec"><label class="rv-all"><input type="checkbox" data-all="${gr.g}"> <b>${esc(gr.label)}</b> <small>${gr.items.length}개</small>${gr.g === "warns" ? ` <small class="rv-off">주의 신호는 기본으로 빼 둬요</small>` : ""}</label>
            ${gr.g === "posts" ? `<button type="button" class="rv-30" id="rv-30">최근 30일만 선택하기</button>` : ""}
            <div class="rv-items">${gr.items.map(x => { const sec = x.sec || "", it = x.it, cs = !!it && sec !== "warns" && isCS(sec, it), old = sec === "posts" && isOldPost(it);
              return `<label class="rv-it"><input type="checkbox" data-g="${gr.g}" data-k="${x.k}"${sec === "warns" || cs || old ? "" : " checked"}><span>${esc((x.lbl || itemLabel(sec, it)).slice(0, 160))}${x.arr && same(sec, it) ? ` <small class="rv-same">지금과 같음</small>` : ""}${cs ? ` <small class="rv-off">커머스 CS 불만이라 자동으로 뺐어요</small>` : ""}${old ? ` <small class="rv-off rv-old">30일 지난 게시물</small>` : ""}</span></label>`; }).join("")}</div></div>`).join("")}
    </details>
    <button type="button" class="rv-go" id="rv-go">최종 연동</button>
    <p class="rv-status" id="rv-status"></p>`;
  const op = document.querySelector("#sellerUI #op-scroll"); if (op) op.parentNode.insertBefore(box, op);
  const boxes = () => [...box.querySelectorAll("input[data-k]")];
  const count = () => { const on = boxes().filter(b => b.checked).length; box.querySelector("#rv-count").textContent = `${on}/${boxes().length}개 체크`; };
  // 묶음 체크(전체): 하위가 모두 체크면 체크, 일부만이면 '일부'(—) 표시, 하나도 없으면 빈칸
  const syncAll = () => box.querySelectorAll("input[data-all]").forEach(a => {
    const its = [...box.querySelectorAll(`input[data-g="${a.dataset.all}"]`)], on = its.filter(b => b.checked).length;
    a.checked = its.length > 0 && on === its.length; a.indeterminate = on > 0 && on < its.length;
  });
  box.querySelectorAll("input[data-all]").forEach(a => a.onchange = () => { box.querySelectorAll(`input[data-g="${a.dataset.all}"]`).forEach(b => b.checked = a.checked); a.indeterminate = false; count(); });
  box.addEventListener("change", ev => { if (ev.target.dataset.g) syncAll(); count(); saveChecks(); });
  syncAll(); count();
  // 체크 상태 공유: 바꿀 때마다 시트('여론체크')에 저장, 열 때·화면으로 돌아올 때 불러옴 → 기기가 달라도 같은 체크
  const day = v => String(v || "").replace("at:", "").slice(0, 10);
  const saved = box.querySelector("#rv-saved");
  // 주의 신호는 항상 빼 두고, CS 불만 자동 해제(2026-11-16 도입) 이전에 저장된 체크면 CS 불만도 뺌
  const RULE_AT = new Date("2026-11-16T07:30:00Z");   // 이 시각 전에 저장된 체크엔 자동 해제 규칙(CS·상업화 불만, 30일 지난 게시물)을 다시 적용
  const applyKeys = (keys, at) => {
    const on = new Set(keys), old = !at || new Date(at) < RULE_AT;
    ["changes", "iq"].forEach(g => { if (on.has(g)) boxes().forEach(b => { if (b.dataset.k.startsWith(g + ":")) on.add(b.dataset.k); }); });   // 예전 '묶음 1개' 체크 → 낱개 전부
    boxes().forEach(b => {
      const k = b.dataset.k, sec = k.split(":")[0];
      b.checked = on.has(k) && sec !== "warns" && !(old && b.closest(".rv-it")?.querySelector(".rv-off"));
    });
    syncAll(); count();
  };
  const b30 = box.querySelector("#rv-30");
  if (b30) b30.onclick = ev => { ev.preventDefault();
    box.querySelectorAll('input[data-k^="posts:"]').forEach(b => b.checked = !b.closest(".rv-it").querySelector(".rv-old"));
    syncAll(); count(); saveChecks(); };
  let saveT = 0, dirtyAt = 0, serverOK = false;   // 조회기록 Apps Script 가 체크 저장을 지원할 때만 저장
  function saveChecks() {
    if (!serverOK) { saved.textContent = "(체크 저장 준비 중 — 이 기기에서만 적용)"; return; }
    clearTimeout(saveT); dirtyAt = Date.now(); saved.textContent = "저장 중…";
    saveT = setTimeout(() => {
      if (!window.LOG_URL_ADM) return;
      const keys = boxes().filter(b => b.checked).map(b => b.dataset.k);
      fetch(window.LOG_URL_ADM, {method: "POST", mode: "no-cors", headers: {"Content-Type": "text/plain;charset=utf-8"},
        body: JSON.stringify({type: "opinion_check", seller: "admin", repo: s.repo, draftAt: "at:" + draft.at, keys, name: VIEWER.name || "", key: load("adm.key", "")})})
        .then(() => { saved.textContent = "✓ 저장됨"; })
        .catch(() => { saved.textContent = "저장 못 함 — 인터넷 연결을 확인해 주세요"; });
    }, 700);
  }
  async function loadChecks() {
    if (!window.LOG_URL_ADM || !box.isConnected || Date.now() - dirtyAt < 8000) return;
    try {
      const q = a => fetch(`${window.LOG_URL_ADM}?action=${a}&repo=${encodeURIComponent(s.repo)}&t=${Date.now()}`).then(r => r.json());
      const [c, y] = await Promise.all([q("opinion_check"), q("opinion_sync").catch(() => null)]);
      serverOK = true;
      if (Date.now() - dirtyAt < 8000) return;            // 불러오는 사이에 이 기기에서 바꿨으면 그대로 둠
      // 이 초안에 대한 '저장된 체크'와 '마지막 최종 연동' 중 더 최근 것을 보여 줌 (저장된 체크가 없으면 연동한 항목)
      const sameDraft = x => x && Array.isArray(x.keys) && day(x.draftAt) === day(draft.at) && (x !== y || x.keys.length);
      const pick = [c, y].filter(sameDraft).sort((a, b2) => new Date(b2.at) - new Date(a.at))[0];
      if (pick) applyKeys(pick.keys, pick.at);
    } catch (e) {}
  }
  await loadChecks();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") loadChecks(); });
  // 마지막 연동 상태
  try {
    const r = await fetch(`${window.LOG_URL_ADM}?action=opinion_sync&repo=${encodeURIComponent(s.repo)}`);
    const last = await r.json();
    if (last && last.keys && last.keys.length) box.querySelector("#rv-status").textContent = `마지막 연동: ${String(last.at || "").slice(0, 16).replace("T", " ")} · ${last.keys.length}개 항목${String(last.draftAt).replace("at:", "").slice(0, 10) === String(draft.at).slice(0, 10) || new Date(last.draftAt).toDateString() === new Date(draft.at).toDateString() ? " (이 초안)" : " (이전 초안)"}`;
  } catch (e) {}
  // 연동 확인: ① 시트에 기록됐는지 ② 셀러 캘린더(opinion.json)에 들어갔는지 화면에 알려 줌
  async function watchSync(n) {
    const st = box.querySelector("#rv-status"), sent = Date.now();
    const getJ = async u => { const r = await fetch(u + (u.includes("?") ? "&" : "?") + "t=" + Date.now(), {cache: "no-store"}); return r.json(); };
    let rec = null;
    for (let i = 0; i < 8 && !rec; i++) {
      await new Promise(r => setTimeout(r, 2500));
      try { const y = await getJ(`${window.LOG_URL_ADM}?action=opinion_sync&repo=${encodeURIComponent(s.repo)}`); if (+y.syncedAt >= sent - 60000) rec = y; } catch (e) {}
    }
    if (!rec) { st.textContent = "연동 기록이 시트에 남지 않았어요. 인터넷 연결을 확인하고 '최종 연동'을 다시 눌러 주세요."; return; }
    st.textContent = `연동 기록 완료 (${n}개 항목) · 셀러 캘린더 반영 중… 보통 1~5분 걸려요.`;
    for (let i = 0; i < 40; i++) {             // 최대 10분 확인
      await new Promise(r => setTimeout(r, 15000));
      try { const op = await getJ(`/${s.repo}/opinion.json`); if (String(op._synced) === String(rec.syncedAt)) { st.textContent = `✓ ${s.name}님 셀러 캘린더에 반영됐어요 (${n}개 항목).`; return; } } catch (e) {}
    }
    st.textContent = "연동 기록은 됐는데 셀러 캘린더 반영이 늦어지고 있어요. 30분 안에 자동으로 다시 시도돼요.";
  }
  box.querySelector("#rv-go").onclick = async () => {
    const keys = boxes().filter(b => b.checked).map(b => b.dataset.k);
    if (!keys.length) { alert("체크한 항목이 없어요. 셀러 캘린더에 보낼 항목을 먼저 체크해 주세요."); return; }
    if (!confirm(`${s.name}님 셀러 캘린더에 체크한 ${keys.length}개 항목을 연동할까요?\n(보통 5분 안에 셀러 캘린더에 반영돼요)`)) return;
    if (!window.LOG_URL_ADM) { alert("연동 주소가 없어 보내지 못했어요."); return; }
    const key = await syncKey(true); if (!key) return;
    clearTimeout(saveT); dirtyAt = Date.now();   // 연동한 체크 상태도 저장 → 다른 기기·다시 열어도 같게
    fetch(window.LOG_URL_ADM, {method: "POST", mode: "no-cors", headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({type: "opinion_check", seller: "admin", repo: s.repo, draftAt: "at:" + draft.at, keys, name: VIEWER.name || "", key})}).catch(() => {});
    fetch(window.LOG_URL_ADM, {method: "POST", mode: "no-cors", headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({type: "opinion_sync", seller: "admin", repo: s.repo, draftAt: "at:" + draft.at, keys, name: VIEWER.name || "", key})})
      .then(() => { box.querySelector("#rv-status").textContent = `연동 요청을 보냈어요 (${keys.length}개 항목). 셀러 캘린더에는 보통 5분 안에 반영돼요.`; watchSync(keys.length); })
      .catch(() => { box.querySelector("#rv-status").textContent = "연동 요청을 보내지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요."; });
  };
}

var started = false;
async function showDrafts() {   // 검토 대기 목록: 최종 연동이 셀러 캘린더까지 끝난 셀러는 뺌
  try {
    const nc = u => fetch(u + (u.includes("?") ? "&" : "?") + "t=" + Date.now(), {cache: "no-store"}).then(r => r.ok ? r.json() : null).catch(() => null);
    const list = (await nc(new URL("drafts/index.json", location.href).href)) || [];
    const day = v => String(v || "").replace("at:", "").slice(0, 10);
    const done = async repo => {
      if (!window.LOG_URL_ADM) return false;
      const [draft, sync, live] = await Promise.all([nc(new URL(`drafts/${repo}/opinion.json`, location.href).href),
        nc(`${window.LOG_URL_ADM}?action=opinion_sync&repo=${encodeURIComponent(repo)}`), nc(`/${repo}/opinion.json`)]);
      return !!(draft && sync && live && sync.keys && sync.keys.length && day(sync.draftAt) === day(draft.at) && String(live._synced) === String(sync.syncedAt));
    };
    const ss = list.map(repo => SELLERS.find(s => s.repo === repo)).filter(Boolean);
    const flags = await Promise.all(ss.map(s => done(s.repo)));
    const wait = ss.filter((s, i) => !flags[i]);
    if (!wait.length) { $("#drafts").hidden = true; return; }
    $("#drafts").innerHTML = `<b>검토 대기 댓글 여론 ${wait.length}</b><span>셀러 캘린더에는 아직 적용되지 않았어요. 눌러서 확인하세요.</span><div class="adm-draft-links">${wait.map(s => `<a class="chip" href="?s=${s.repo}#opinion" style="--c:${s.c};text-decoration:none;color:inherit"><i></i>${esc(s.name)} →</a>`).join("")}</div>`;
    $("#drafts").hidden = false;
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && started) showDrafts(); });
function start() {
if (started) return; started = true;
$("#sync-all").onclick = () => buildNow(SELLERS, $("#sync-all-st"), $("#sync-all"));
showDrafts();
renderAll();
let done = 0, failed = [];
SELLERS.forEach(s => fetch(`../${s.repo}/data.json?t=${Date.now()}`, {cache: "no-store"})
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(D => { ALL[s.repo] = digest(s, D); })
  .catch(() => failed.push(s.name))
  .finally(() => {
    done++;
    renderAll();
    $("#note").textContent = done < SELLERS.length ? `셀러 캘린더를 불러오는 중이에요… (${done}/${SELLERS.length})`
      : failed.length ? `불러오지 못한 셀러: ${failed.join(", ")} — 잠시 후 다시 열어 주세요.` : `셀러 ${SELLERS.length}명의 캘린더를 모두 불러왔어요. 셀러를 눌러 켜고 끌 수 있어요.`;
  }));
// 5분마다 새로 불러오기 (셀러 시트가 바뀌면 반영)
setInterval(() => SELLERS.forEach(s => fetch(`../${s.repo}/data.json?t=${Date.now()}`, {cache: "no-store"}).then(r => r.json()).then(D => { ALL[s.repo] = digest(s, D); renderAll(); }).catch(() => {})), 5 * 60 * 1000);
}
window.__admin = {SELLERS, loadSeller, unlock, route};
})();
</script>
